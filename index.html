<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MachineHub Uganda Admin</title><style>body{font-family:system-ui;margin:30px;max-width:900px}input,button{padding:10px;margin:4px}pre{background:#f4f4f4;padding:15px;overflow:auto}</style></head><body><h1>MachineHub Uganda — Admin</h1><p>Stage 6 admin API smoke-test console.</p><input id="base" value="http://localhost:3000" size="35"><input id="token" placeholder="ADMIN JWT" size="55"><button onclick="load()">Load overview</button><pre id="out">Enter an admin JWT and click Load overview.</pre><script>async function load(){const b=document.getElementById('base').value,t=document.getElementById('token').value;const r=await fetch(b+'/api/admin/overview',{headers:{Authorization:'Bearer '+t}});document.getElementById('out').textContent=await r.text()}</script></body></html>
